name: release

# Ручной релиз: переименовать Unreleased в версию в CHANGELOG.md,
# закоммитить, запушить, поставить тег vX.Y.Z и запушить тег.
# Notes релиза собираются из секции Unreleased автоматически.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            bin: tui-edit.exe
          - os: ubuntu-latest
            rid: linux-x64
            bin: tui-edit
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test TuiEdit.Tests --nologo
      - run: dotnet publish TuiEdit.csproj -c Release -r ${{ matrix.rid }} --self-contained false /p:PublishSingleFile=true /p:DebugType=None --nologo
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.rid }}
          if-no-files-found: error
          path: bin/Release/net10.0/${{ matrix.rid }}/publish/${{ matrix.bin }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Build notes from CHANGELOG
        run: python3 -c "
import re
text = open('CHANGELOG.md', encoding='utf-8').read()
m = re.search(r'## \[Unreleased\]\n(.*?)(?=\n## \[|\Z)', text, re.S)
body = m.group(1).strip() if m else 'See CHANGELOG.md.'
header = '''Simple TUI text editor in the style of MS Edit / nano. Pure System.Console, no third-party libraries, .NET 10.

Requires the .NET 10 runtime (https://dotnet.microsoft.com/download/dotnet/10.0). Unzip and run tui-edit (on Linux chmod +x first).

'''
open('NOTES.md', 'w', encoding='utf-8').write(header + body + '\n')
print(open('NOTES.md', encoding='utf-8').read())
"
      - name: Pack zips
        run: |
          VER="${GITHUB_REF_NAME#v}"
          (cd dist/binary-win-x64 && zip -j "../../tui-edit-$VER-win-x64.zip" tui-edit.exe)
          (cd dist/binary-linux-x64 && zip -j "../../tui-edit-$VER-linux-x64.zip" tui-edit)
          ls -la tui-edit-*.zip
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${GITHUB_REF_NAME#v}"
          gh release create "${{ github.ref_name }}" \
            "tui-edit-$VER-win-x64.zip" "tui-edit-$VER-linux-x64.zip" \
            --title "TuiEdit ${{ github.ref_name }}" --notes-file NOTES.md
