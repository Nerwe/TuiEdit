name: release

# Ручной релиз: переименовать Unreleased в версию в CHANGELOG.md,
# закоммитить, запушить, поставить тег vX.Y.Z и запушить тег.
# Notes релиза собираются из секции Unreleased автоматически.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            bin: tui-edit.exe
          - os: ubuntu-latest
            rid: linux-x64
            bin: tui-edit
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Cache NuGet
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      - run: dotnet test TuiEdit.Tests --nologo
      - run: dotnet publish TuiEdit.csproj -c Release -r ${{ matrix.rid }} --self-contained false /p:PublishSingleFile=true /p:DebugType=None --nologo
      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.rid }}
          if-no-files-found: error
          path: bin/Release/net10.0/${{ matrix.rid }}/publish/${{ matrix.bin }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
      - name: Build notes from CHANGELOG
        run: python3 .github/workflows/release-notes.py "${{ github.ref_name }}"
      - name: Pack zips
        run: |
          VER="${GITHUB_REF_NAME#v}"
          (cd dist/binary-win-x64 && zip -j "../../tui-edit-$VER-win-x64.zip" tui-edit.exe)
          (cd dist/binary-linux-x64 && zip -j "../../tui-edit-$VER-linux-x64.zip" tui-edit)
          ls -la tui-edit-*.zip
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${GITHUB_REF_NAME#v}"
          gh release create "${{ github.ref_name }}" \
            "tui-edit-$VER-win-x64.zip" "tui-edit-$VER-linux-x64.zip" \
            --title "TuiEdit ${{ github.ref_name }}" --notes-file NOTES.md
