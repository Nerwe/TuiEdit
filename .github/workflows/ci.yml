name: ci

on:
  push:
  pull_request:

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Cache NuGet
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      - run: dotnet restore TuiEdit.csproj
      - run: dotnet restore TuiEdit.Tests/TuiEdit.Tests.csproj
      - run: dotnet build --no-restore --nologo
      - run: dotnet format TuiEdit.csproj --verify-no-changes --no-restore --verbosity minimal
      - run: dotnet format TuiEdit.Tests/TuiEdit.Tests.csproj --verify-no-changes --no-restore --verbosity minimal
      - run: dotnet test TuiEdit.Tests --nologo
