name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  actions: read # CodeQL reads the workflow run (telemetry/status); without it SARIF upload 403s
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - uses: github/codeql-action/init@v3
        with:
          languages: csharp
      - run: dotnet build TuiEdit.csproj --nologo
      - run: dotnet build TuiEdit.Tests/TuiEdit.Tests.csproj --nologo
      - uses: github/codeql-action/analyze@v3
